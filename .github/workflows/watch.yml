name: vintage-watcher
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a bit late)
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write
concurrency: watcher
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --only-shell chromium
      - run: python watcher.py
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Remember which listings were already sent
        run: |
          git config user.name watcher-bot
          git config user.email watcher-bot@users.noreply.github.com
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen listings" && git push)
